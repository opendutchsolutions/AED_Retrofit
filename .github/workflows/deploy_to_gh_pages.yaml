name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Firmware: build, hash & sign (TBYB), publish the UF2 for the web app
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib ninja-build

      - name: Checkout pico-sdk and pico-extras
        run: |
          git clone --depth 1 --branch 2.2.0 --recursive --shallow-submodules https://github.com/raspberrypi/pico-sdk.git "$HOME/pico-sdk"
          git clone --depth 1 --recursive --shallow-submodules https://github.com/raspberrypi/pico-extras.git "$HOME/pico-extras"

      - name: Restore signing key
        env:
          FW_SIGNING_KEY: ${{ secrets.FW_SIGNING_KEY }}
        run: printf '%s\n' "$FW_SIGNING_KEY" > fw/ota_signing_key.pem

      - name: Build, hash & sign firmware
        run: |
          cmake -S fw -B fw/build \
            -DPICO_SDK_PATH="$HOME/pico-sdk" \
            -DPICO_EXTRAS_PATH="$HOME/pico-extras" \
            -DPICO_BOARD=pico2_w \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build fw/build
          openssl dgst -sha256 -sign fw/ota_signing_key.pem \
            -out fw/build/picow-a2dp.sig.der fw/build/picow-a2dp.bin
          python3 fw/sig-der-to-raw.py fw/build/picow-a2dp.sig.der fw/build/picow-a2dp.sig
          mkdir -p web_app/public/firmware
          cp fw/build/picow-a2dp.uf2 web_app/public/firmware/picow-a2dp.uf2
          cp fw/build/picow-a2dp.sig web_app/public/firmware/picow-a2dp.sig
          FW_VERSION=$(sed -n 's/.*FW_VERSION="\([^"]*\)".*/\1/p' fw/CMakeLists.txt | head -1)
          printf '{"version": "%s"}\n' "$FW_VERSION" > web_app/public/firmware/version.json

      # --- Site: build and deploy (includes the signed firmware file)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web_app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web_app

      - name: Build site
        run: npm run build
        working-directory: web_app

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_app/dist

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Commits pushed by the firmware workflow use GITHUB_TOKEN, which does
  # not trigger push-based workflows — chain on its completion instead
  workflow_run:
    workflows: ["Build, sign & publish firmware"]
    types: [completed]

permissions:
  contents: write

jobs:
  deploy:
    # On the workflow_run trigger, only deploy when the firmware build succeeded
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_app/dist

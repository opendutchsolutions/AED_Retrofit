name: Build, sign & publish firmware

on:
  push:
    branches:
      - main
    paths:
      - 'fw/**'
      - '.github/workflows/firmware.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib ninja-build

      - name: Checkout pico-sdk and pico-extras
        run: |
          git clone --depth 1 --branch 2.2.0 --recursive --shallow-submodules https://github.com/raspberrypi/pico-sdk.git "$HOME/pico-sdk"
          git clone --depth 1 --recursive --shallow-submodules https://github.com/raspberrypi/pico-extras.git "$HOME/pico-extras"

      - name: Restore signing key
        env:
          FW_SIGNING_KEY: ${{ secrets.FW_SIGNING_KEY }}
        run: printf '%s\n' "$FW_SIGNING_KEY" > fw/signing_key.pem

      - name: Build, hash & sign firmware
        run: |
          cmake -S fw -B fw/build \
            -DPICO_SDK_PATH="$HOME/pico-sdk" \
            -DPICO_EXTRAS_PATH="$HOME/pico-extras" \
            -DPICO_BOARD=pico2_w \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build fw/build

      - name: Publish firmware for the web app
        run: |
          mkdir -p web_app/public/firmware
          cp fw/build/picow-a2dp.uf2 web_app/public/firmware/picow-a2dp.uf2

      - name: Commit published firmware
        run: |
          git config user.name "firmware-bot"
          git config user.email "actions@github.com"
          git add web_app/public/firmware/picow-a2dp.uf2
          if git diff --cached --quiet; then
            echo "No firmware change, nothing to commit"
            exit 0
          fi
          git commit -m "chore(fw): publish signed firmware for OTA (generated by Mistral Vibe)"
          git push


<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .app { padding: 1rem 0; display: flex; flex-direction: column; gap: 1rem; font-family: var(--font-sans); }
  .status-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-tertiary);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #B4B2A9; flex-shrink: 0; transition: background 0.2s; }
  .dot.connected { background: #639922; }
  .dot.scanning { background: #BA7517; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
  .status-text { font-size: 13px; color: var(--color-text-secondary); flex: 1; }
  .connect-btn {
    font-size: 12px; padding: 5px 12px; border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-primary);
    color: var(--color-text-primary); cursor: pointer; font-family: var(--font-sans);
  }
  .connect-btn:hover { background: var(--color-background-secondary); }
  .connect-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .card {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 1rem 1.25rem;
  }
  .section-label {
    font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
    color: var(--color-text-secondary); text-transform: uppercase; margin-bottom: 10px;
  }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

  .indicator {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 10px 6px; border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
    transition: background 0.15s, border-color 0.15s;
  }
  .indicator.active-btn { background: #FCEBEB; border-color: #F09595; }
  .indicator.active-btn .ind-dot { background: #E24B4A; }
  .indicator.active-btn .ind-label { color: #791F1F; }
  .indicator.active-sensor { background: #E6F1FB; border-color: #85B7EB; }
  .indicator.active-sensor .ind-dot { background: #378ADD; }
  .indicator.active-sensor .ind-label { color: #0C447C; }
  .ind-dot { width: 20px; height: 20px; border-radius: 50%; background: #B4B2A9; transition: background 0.15s; }
  .ind-label { font-size: 11px; font-weight: 500; color: var(--color-text-secondary); text-align: center; line-height: 1.3; }

  .led-toggle {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 10px 6px; border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
    cursor: pointer; user-select: none; font-family: var(--font-sans);
    transition: background 0.15s, border-color 0.15s;
  }
  .led-toggle:hover { border-color: var(--color-border-secondary); }
  .led-toggle.on { background: #EAF3DE; border-color: #97C459; }
  .led-toggle.on .led-bulb { background: #639922; box-shadow: 0 0 0 3px #C0DD97; }
  .led-toggle.on .led-label { color: #27500A; }
  .led-bulb { width: 18px; height: 18px; border-radius: 50%; background: #B4B2A9; transition: background 0.15s, box-shadow 0.15s; }
  .led-label { font-size: 11px; font-weight: 500; color: var(--color-text-secondary); text-align: center; line-height: 1.3; }

  .raw-row {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
    font-size: 12px; font-family: var(--font-mono);
    padding: 7px 12px;
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-tertiary);
  }
  .raw-label { color: var(--color-text-tertiary); font-size: 11px; min-width: 56px; }
  .raw-val { color: var(--color-text-primary); font-weight: 500; }

  .divider { height: 0.5px; background: var(--color-border-tertiary); margin: 10px 0; }

  .log-box {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--color-text-secondary); line-height: 1.6;
    max-height: 90px; overflow-y: auto;
    padding: 8px 12px;
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-tertiary);
  }
  .log-entry { display: flex; gap: 8px; }
  .log-time { color: var(--color-text-tertiary); flex-shrink: 0; }
  .log-msg.err { color: #E24B4A; }
  .log-msg.ok { color: #639922; }
</style>

<div class="app">

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span class="status-text" id="status-text">Not connected</span>
    <button class="connect-btn" id="connect-btn" onclick="toggleConnect()">Connect</button>
  </div>

  <div class="card">
    <div class="section-label">Buttons — 0xFF11 (notify)</div>
    <div class="grid-3">
      <div class="indicator" id="b0"><div class="ind-dot"></div><div class="ind-label">Shock</div></div>
      <div class="indicator" id="b1"><div class="ind-dot"></div><div class="ind-label">On / Off</div></div>
      <div class="indicator" id="b2"><div class="ind-dot"></div><div class="ind-label">Info</div></div>
    </div>
    <div class="divider"></div>
    <div class="section-label" style="margin-bottom:8px;">Sensors</div>
    <div class="grid-2">
      <div class="indicator" id="b3"><div class="ind-dot"></div><div class="ind-label">Card slot</div></div>
      <div class="indicator" id="b4"><div class="ind-dot"></div><div class="ind-label">Pads inserted</div></div>
    </div>
    <div class="raw-row">
      <span class="raw-label">raw byte</span>
      <span class="raw-val" id="btn-raw">0x00</span>
      <span class="raw-label" style="margin-left:12px;">bits</span>
      <span class="raw-val" id="btn-bits">00000000</span>
    </div>
  </div>

  <div class="card">
    <div class="section-label">LEDs — 0xFF12 (write without response)</div>
    <div class="grid-3">
      <div class="led-toggle" id="l0" onclick="toggleLed(0)"><div class="led-bulb"></div><div class="led-label">Shock</div></div>
      <div class="led-toggle" id="l1" onclick="toggleLed(1)"><div class="led-bulb"></div><div class="led-label">On / Off</div></div>
      <div class="led-toggle" id="l2" onclick="toggleLed(2)"><div class="led-bulb"></div><div class="led-label">Info</div></div>
      <div class="led-toggle" id="l3" onclick="toggleLed(3)"><div class="led-bulb"></div><div class="led-label">Hands off</div></div>
      <div class="led-toggle" id="l4" onclick="toggleLed(4)"><div class="led-bulb"></div><div class="led-label">Low belly</div></div>
      <div class="led-toggle" id="l5" onclick="toggleLed(5)"><div class="led-bulb"></div><div class="led-label">Breast</div></div>
    </div>
    <div class="raw-row">
      <span class="raw-label">raw byte</span>
      <span class="raw-val" id="led-raw">0x00</span>
      <span class="raw-label" style="margin-left:12px;">bits</span>
      <span class="raw-val" id="led-bits">00000000</span>
    </div>
  </div>

  <div class="log-box" id="log"></div>
</div>

<script>
const SVC  = '0000ff10-0000-1000-8000-00805f9b34fb';
const CBTNS = '0000ff11-0000-1000-8000-00805f9b34fb';
const CLEDS = '0000ff12-0000-1000-8000-00805f9b34fb';

let device = null, charBtns = null, charLeds = null;
let ledMask = 0;

function log(msg, type='') {
  const box = document.getElementById('log');
  const t = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const el = document.createElement('div');
  el.className='log-entry';
  el.innerHTML=`<span class="log-time">${t}</span><span class="log-msg ${type}">${msg}</span>`;
  box.prepend(el);
}

function toBits(v) { return v.toString(2).padStart(8,'0'); }
function toHex(v)  { return '0x'+v.toString(16).padStart(2,'0').toUpperCase(); }

function setStatus(state, text) {
  document.getElementById('dot').className = 'dot '+state;
  document.getElementById('status-text').textContent = text;
  const btn = document.getElementById('connect-btn');
  btn.textContent = state==='connected' ? 'Disconnect' : 'Connect';
  btn.disabled = state==='scanning';
  const interactive = state==='connected';
  for(let i=0;i<6;i++) document.getElementById('l'+i).style.pointerEvents = interactive ? '' : 'none';
}

function renderButtons(mask) {
  for(let i=0;i<3;i++) {
    const el = document.getElementById('b'+i);
    el.classList.toggle('active-btn', !!(mask & (1<<i)));
  }
  for(let i=3;i<5;i++) {
    const el = document.getElementById('b'+i);
    el.classList.toggle('active-sensor', !!(mask & (1<<i)));
  }
  document.getElementById('btn-raw').textContent = toHex(mask);
  document.getElementById('btn-bits').textContent = toBits(mask);
}

function renderLeds() {
  for(let i=0;i<6;i++)
    document.getElementById('l'+i).classList.toggle('on', !!(ledMask & (1<<i)));
  document.getElementById('led-raw').textContent = toHex(ledMask);
  document.getElementById('led-bits').textContent = toBits(ledMask);
}

async function toggleConnect() {
  if(device && device.gatt.connected) { device.gatt.disconnect(); return; }
  if(!navigator.bluetooth) { log('Web Bluetooth not available','err'); return; }
  setStatus('scanning','Scanning...');
  try {
    device = await navigator.bluetooth.requestDevice({
      filters:[{services:[SVC]}], optionalServices:[SVC]
    });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SVC);
    charBtns = await service.getCharacteristic(CBTNS);
    charLeds = await service.getCharacteristic(CLEDS);
    await charBtns.startNotifications();
    charBtns.addEventListener('characteristicvaluechanged', e => {
      renderButtons(e.target.value.getUint8(0));
    });
    const init = await charLeds.readValue();
    ledMask = init.getUint8(0);
    renderLeds();
    setStatus('connected', device.name || 'AED');
    log('Connected — '+(device.name||'AED'), 'ok');
  } catch(e) {
    setStatus('','Not connected');
    log(e.message||'Connection failed','err');
    device=null;
  }
}

function onDisconnect() {
  setStatus('','Not connected');
  log('Disconnected');
  device=null; charBtns=null; charLeds=null;
  renderButtons(0);
}

async function toggleLed(bit) {
  ledMask ^= (1<<bit);
  renderLeds();
  if(charLeds) {
    try {
      await charLeds.writeValueWithoutResponse(new Uint8Array([ledMask]));
      log('LED → '+toHex(ledMask), 'ok');
    } catch(e) {
      log('Write failed: '+e.message,'err');
      ledMask ^= (1<<bit);
      renderLeds();
    }
  }
}

setStatus('','Not connected');
log('Ready — click Connect to pair');
</script>
